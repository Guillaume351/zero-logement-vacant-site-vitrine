name: 🔮 CI - Quality checks

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      PYTHONPATH: .
    strategy:
      matrix:
        python-version: ["3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dju
          POSTGRES_PASSWORD: djpwd
          POSTGRES_DB: djdb
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: 📔 Install just
        uses: extractions/setup-just@v2
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
      - name: Upgrade pip before pre-commit installs its dependencies
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - uses: pre-commit/action@v3.0.1
      - name: ✨ Black & ruff on all files
        run: |
          just quality
      - name: 🌍 Install dependencies
        run: |
          uv sync
      - name: 📄 Copy empty .env.test to .env
        run: |
          cp .env.test .env
      - name: 📦 Check declared dependencies with deptry
        run: |
          just deps-check
